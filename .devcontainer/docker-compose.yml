services:
  app:
    # Universal image: Java 21 + Maven + Node 20 + gh already inside.
    # No build step, no features, nothing to fail at container-build time.
    image: mcr.microsoft.com/devcontainers/universal:2-linux
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      # MySQL is a sibling service, reachable by service name.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/capstone?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: capstone
      SPRING_DATASOURCE_PASSWORD: capstone
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: capstone
      MYSQL_USER: capstone
      MYSQL_PASSWORD: capstone
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucapstone", "-pcapstone"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
