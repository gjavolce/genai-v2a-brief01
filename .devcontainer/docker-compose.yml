services:
  app:
    # Java 21, 16 layers / 0.63 GB — replacing universal:2-linux, which was
    # 35 layers / 3.84 GB and measured at 412s of a 474s create. That cost
    # was layer EXTRACTION, not bandwidth (95% of bytes arrived in the first
    # 20s; unpacking took the remaining 392s), so layer count and uncompressed
    # size are the levers.
    #
    # Built from a Dockerfile only to delete a broken apt source in the base
    # image — see .devcontainer/Dockerfile. Node, gh and sshd come from
    # features. Note the image has NO system Maven: verify.sh and
    # post-create.sh both use api/mvnw, so nothing needs it.
    #
    # No platform pin: this image is multi-arch, so Codespaces gets amd64 and
    # an instructor on Apple Silicon gets arm64 natively instead of Rosetta.
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    environment:
      # MySQL is a sibling service, reachable by service name.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/capstone?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: capstone
      SPRING_DATASOURCE_PASSWORD: capstone
      DB_HOST: db
      DB_PORT: "3306"
    # Start order only — deliberately NOT "condition: service_healthy".
    # The health gate blocked this container from starting until MySQL had
    # initialised its data directory and passed a check, ~40-60s of dead
    # serial time on every create. Nothing in the create path touches the
    # database any more (post-create.sh's wait loop is gone), so MySQL now
    # initialises in parallel with the editor coming up and Maven warming.
    # By the time verify.sh checks reachability, MySQL has long been up.
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    # Binary logging and performance_schema are overhead a workshop database
    # never uses — both cost start-up time and memory on an 8 GB box.
    command:
      - "--skip-log-bin"
      - "--performance-schema=OFF"
      - "--innodb-buffer-pool-size=128M"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: capstone
      MYSQL_USER: capstone
      MYSQL_PASSWORD: capstone
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucapstone", "-pcapstone"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
